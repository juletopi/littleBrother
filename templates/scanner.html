{% extends "layout.html" %}

{% block title %}littleBrother | Scanner{% endblock %}

{% block head %}
<style>
	.search {
		background: var(--panel);
		border: 1px solid var(--border);
		color: var(--text);
		border-radius: 10px;
		padding: 9px 10px;
		outline: none;
		width: 100%;
	}

	.new-session {
		border: 1px solid var(--border);
		background: linear-gradient(180deg, #162737, #132131);
		color: #dff7ec;
		border-radius: 10px;
		padding: 10px;
		text-align: center;
		cursor: pointer;
	}

	.section-title {
		color: var(--muted);
		font-size: 11px;
		letter-spacing: 1px;
		text-transform: uppercase;
		margin-top: 8px;
	}

	.session-list {
		display: flex;
		flex-direction: column;
		gap: 8px;
		overflow: auto;
		padding-right: 2px;
		flex: 1;
	}

	.session-item {
		background: var(--panel);
		border: 1px solid transparent;
		border-radius: 10px;
		padding: 10px;
		cursor: pointer;
	}

	.session-item.active {
		border-color: #2c4f66;
		background: #162634;
	}

	.session-item-title {
		font-size: 13px;
		color: #e3eef8;
		margin-bottom: 4px;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.session-item-subtitle {
		font-size: 11px;
		color: var(--muted);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.tabs {
		display: flex;
		align-items: center;
		gap: 6px;
		border-bottom: 1px solid var(--border);
		background: rgba(10, 16, 22, .85);
		padding: 10px;
		overflow-x: auto;
	}

	.tab {
		border: 1px solid transparent;
		border-radius: 10px;
		padding: 7px 10px;
		font-size: 13px;
		color: var(--muted);
		background: #111a23;
		white-space: nowrap;
		cursor: pointer;
	}

	.tab.active {
		color: #dff9ec;
		border-color: #31556b;
		background: #183143;
	}

	.chat {
		flex: 1;
		overflow: auto;
		padding: 18px;
		display: flex;
		flex-direction: column;
		gap: 10px;
	}

	.msg {
		max-width: min(92%, 980px);
		border-radius: 12px;
		border: 1px solid var(--border);
		box-shadow: var(--shadow);
	}

	.msg.user {
		align-self: flex-end;
		background: linear-gradient(180deg, #163349, #112b3f);
		border-color: #345c73;
	}

	.msg.assistant {
		align-self: flex-start;
		background: linear-gradient(180deg, #141f28, #0f1a23);
	}

	.msg-head {
		border-bottom: 1px solid rgba(45, 65, 82, .5);
		font-size: 11px;
		letter-spacing: .5px;
		color: var(--muted);
		padding: 8px 11px;
		text-transform: uppercase;
	}

	.msg-body {
		padding: 10px 12px;
		font-size: 13px;
		line-height: 1.45;
		white-space: pre-wrap;
	}

	.msg-body pre {
		margin: 0;
		font-family: Consolas, monospace;
		font-size: 12px;
		line-height: 1.45;
		color: #cde6f5;
		white-space: pre-wrap;
		word-break: break-word;
	}

	.status-open { color: var(--open); }
	.status-closed { color: var(--closed); }
	.status-filtered { color: var(--filtered); }
	.status-warn { color: var(--warn); }

	.environment-banner {
		margin: 12px 18px 0;
		border: 1px solid #3b4d60;
		background: linear-gradient(180deg, rgba(35, 47, 59, .95), rgba(18, 28, 38, .95));
		border-radius: 12px;
		padding: 10px 12px;
		color: #d8e7f2;
		font-size: 13px;
		line-height: 1.4;
	}

	.environment-banner strong { color: #fff; }

	.composer {
		border-top: 1px solid var(--border);
		padding: 12px;
		background: rgba(9, 14, 19, .85);
	}

	.composer-shell {
		border: 1px solid #273c4f;
		border-radius: 16px;
		background: #111c26;
		padding: 10px;
	}

	.composer-input {
		display: block;
		width: 100%;
		border: 0;
		outline: none;
		background: transparent;
		color: var(--text);
		font-size: 14px;
		padding: 4px 2px 10px;
	}

	.composer-actions {
		display: flex;
		align-items: center;
		gap: 8px;
		padding-top: 8px;
	}

	.command-help,
	#sendBtn {
		border: 1px solid #394c5e;
		border-radius: 999px;
		background: #101c26;
		color: var(--muted);
		font-weight: 700;
		cursor: pointer;
		padding: 0 14px;
		height: 34px;
	}

	#sendBtn {
		margin-left: auto;
		border-color: #2a5c44;
		background: linear-gradient(180deg, var(--accent), var(--accent-2));
		color: #052513;
	}

	#sendBtn:disabled {
		cursor: not-allowed;
		opacity: .45;
	}

	@media (max-width: 760px) {
		.section-title,
		.session-list {
			display: none;
		}

		.msg {
			max-width: 98%;
		}
	}
</style>
{% endblock %}

{% block sidebar_tools %}
<input id="searchSessions" class="search" type="text" placeholder="Buscar sessões..." />
<button id="newSessionBtn" class="new-session" type="button"><i class="bi bi-plus-lg me-2" aria-hidden="true"></i>Nova sessão</button>
<div class="section-title">Sessões recentes</div>
<div id="sessionList" class="session-list"></div>
{% endblock %}

{% block content %}
<div id="tabs" class="tabs"></div>
<div id="environmentBanner" class="environment-banner" hidden></div>
<section id="chat" class="chat"></section>
<div class="composer">
	<div class="composer-shell">
		<input id="commandInput" class="composer-input" type="text" placeholder="scan <targets> <ports> <protocols> [syn|connect]" />
		<div class="composer-actions">
			<button id="helpBtn" class="command-help" type="button">help</button>
			<button id="sendBtn" type="button" disabled>enviar</button>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
<script>
const sessions = [];
let activeSessionId = null;
let environmentInfo = null;

const nowTime = () => new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const activeSession = () => sessions.find((session) => session.id === activeSessionId);
const escapeHtml = (value) => String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");

function renderSessionList() {
	const list = document.getElementById("sessionList");
	const search = document.getElementById("searchSessions").value.trim().toLowerCase();
	
    list.innerHTML = "";

	for (const session of [...sessions].sort((a, b) => b.updatedAt - a.updatedAt)) {
		if (search && !session.title.toLowerCase().includes(search) && !session.lastCommand.toLowerCase().includes(search)) continue;
		
        const item = document.createElement("div");

		item.className = `session-item ${session.id === activeSessionId ? "active" : ""}`;
		item.innerHTML = `<div class="session-item-title">${escapeHtml(session.title)}</div><div class="session-item-subtitle">${escapeHtml(session.lastCommand || "sem comandos")}</div>`;
		item.onclick = () => { activeSessionId = session.id; renderAll(); };
		list.appendChild(item);
	}
}

function renderTabs() {
	const tabs = document.getElementById("tabs");
	
    tabs.innerHTML = "";
	
    for (const session of [...sessions].sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 8)) {
		const tab = document.createElement("button");
		
        tab.className = `tab ${session.id === activeSessionId ? "active" : ""}`;
		tab.textContent = session.title;
		tab.onclick = () => { activeSessionId = session.id; renderAll(); };
		tabs.appendChild(tab);
	}
}

function renderChat() {
	const chat = document.getElementById("chat");
	
    chat.innerHTML = "";
	
    const session = activeSession();
	
    if (!session) return;
	
    for (const message of session.messages) {
		const card = document.createElement("div");
		
        card.className = `msg ${message.role}`;
		card.innerHTML = `<div class="msg-head">${message.role === "user" ? "comando" : "scanner"} • ${message.at}</div><div class="msg-body"></div>`;
		
        const body = card.querySelector(".msg-body");
		
        if (message.html) body.innerHTML = message.text;
		else { const pre = document.createElement("pre"); pre.textContent = message.text; body.appendChild(pre); }
		chat.appendChild(card);
	}
	chat.scrollTop = chat.scrollHeight;
}

function renderEnvironmentBanner() {
	const banner = document.getElementById("environmentBanner");
	
    if (!environmentInfo) { banner.hidden = true; return; }
	
    const parts = [`<strong>Ambiente detectado:</strong> ${escapeHtml(environmentInfo.platform_name || environmentInfo.platform || "desconhecido")}`];
	
    if (environmentInfo.is_windows) parts.push("<strong>Aviso:</strong> no Windows, firewall e politicas de rede podem aumentar portas filtered.");
	if (!environmentInfo.syn_scan_available) parts.push("<strong>SYN:</strong> indisponivel neste ambiente. O backend usa TCP connect como fallback.");
	
    parts.push(...(environmentInfo.notes || []).map(escapeHtml));
	banner.innerHTML = parts.join("<br />");
	banner.hidden = false;
}

function renderAll() { renderSessionList(); renderTabs(); renderEnvironmentBanner(); renderChat(); }
function addMessage(role, text, html = false) { const session = activeSession(); if (!session) return; session.messages.push({ role, text, html, at: nowTime() }); session.updatedAt = Date.now(); if (role === "user") session.lastCommand = text; renderAll(); }
function updateLastAssistantMessage(text, html = false) { const session = activeSession(); const message = [...session.messages].reverse().find((item) => item.role === "assistant"); message.text = text; message.html = html; message.at = nowTime(); renderAll(); }
function makeSession(title) { const session = { id: `s-${Date.now()}-${Math.random()}`, title: title || `sessao-${sessions.length + 1}`, lastCommand: "", updatedAt: Date.now(), messages: [{ role: "assistant", text: "Pronto para varrer portas TCP/UDP.\nUse: scan <targets> <ports> <protocols> [syn|connect]\nDigite 'help' para ajuda.", at: nowTime(), html: false }] }; sessions.unshift(session); activeSessionId = session.id; renderAll(); }

function parseCommand(input) {
	const parts = input.trim().split(/\s+/);
	
    if (!input.trim()) return { kind: "empty" };
	if (input.trim().toLowerCase() === "help") return { kind: "help" };
	if (parts[0].toLowerCase() !== "scan") return { kind: "invalid", error: "Comando invalido. Use 'scan' ou 'help'." };
	if (parts.length < 3) return { kind: "invalid", error: "Formato: scan <targets> <ports> <protocols> [syn|connect] ou scan <targets> <protocols> [syn|connect]" };
	
    const isProtocol = (value) => ["tcp", "udp", "tcp,udp", "udp,tcp"].includes(value.toLowerCase());
	
    let ports = "1-1024", protocols = "tcp", method = "connect";
	
    if (parts.length === 3 && isProtocol(parts[2])) protocols = parts[2];
	else if (parts.length === 4 && isProtocol(parts[2])) { protocols = parts[2]; method = parts[3].toLowerCase(); }
	else { ports = parts[2]; protocols = parts[3]; method = (parts[4] || "connect").toLowerCase(); }
	
    if (!["syn", "connect"].includes(method)) return { kind: "invalid", error: "Metodo TCP deve ser syn ou connect." };
	
    return { kind: "scan", payload: { targets: parts[1], ports, protocols, tcp_method: method, timeout: 1, workers: 200 } };
}

function formatResponse(data) {
	const lines = [`scan concluido em ${data.scan.duration_seconds}s`, `metodo tcp: ${data.scan.tcp_method}`, ""];
	
    for (const target of data.scan.targets) { lines.push(`alvo ${target}`); for (const protocol of data.scan.protocols) { const items = data.results[target][protocol] || []; lines.push(`  ${protocol.toUpperCase()}:`); for (const status of ["open", "closed", "filtered"]) lines.push(`    ${status}: ${items.filter((item) => item.status === status).map((item) => item.port).join(",") || "-"}`); } lines.push(""); }
	
    if (data.warnings?.length) lines.push("avisos:", ...data.warnings.map((warning) => `  - ${warning}`));
	
    return `<pre>${escapeHtml(lines.join("\n")).replaceAll("open:", '<span class="status-open">open:</span>').replaceAll("closed:", '<span class="status-closed">closed:</span>').replaceAll("filtered:", '<span class="status-filtered">filtered:</span>')}</pre>`;
}

async function sendCommand() {
	const input = document.getElementById("commandInput"), raw = input.value, command = parseCommand(raw);
	
    if (command.kind === "empty") return;
	
    addMessage("user", raw); input.value = ""; document.getElementById("sendBtn").disabled = true;
	
    if (command.kind === "help") { addMessage("assistant", "Comandos disponiveis:\nhelp\nscan <targets> <ports> <protocols> [syn|connect]\nscan <targets> <protocols> [syn|connect]"); return; }
	if (command.kind === "invalid") { addMessage("assistant", command.error); return; }
	
    addMessage("assistant", "Executando varredura...");
	
    try { const response = await fetch("/api/scan", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(command.payload) }); const data = await response.json(); if (!response.ok || !data.ok) updateLastAssistantMessage(`<span class="status-warn">Erro: ${escapeHtml(data.error || "falha desconhecida")}</span>`, true); else { updateLastAssistantMessage(formatResponse(data), true); const session = activeSession(); if (session.title.startsWith("sessao-")) { session.title = command.payload.targets.split(",")[0]; renderAll(); } } } catch (error) { updateLastAssistantMessage(`<span class="status-warn">Erro de comunicacao com o backend: ${escapeHtml(error)}</span>`, true); }
}

document.getElementById("sendBtn").onclick = sendCommand;
document.getElementById("helpBtn").onclick = () => { document.getElementById("commandInput").value = "help"; sendCommand(); };
document.getElementById("commandInput").oninput = (event) => { document.getElementById("sendBtn").disabled = !event.target.value.trim(); };
document.getElementById("commandInput").onkeydown = (event) => { if (event.key === "Enter") sendCommand(); };
document.getElementById("newSessionBtn").onclick = () => makeSession();
document.getElementById("searchSessions").oninput = renderSessionList;
fetch("/api/info").then((response) => response.json()).then((data) => { environmentInfo = data.environment; renderEnvironmentBanner(); });

makeSession("sessao-1");
</script>
{% endblock %}
