<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>littleBrother | Scanner</title>
	<link type="image/png" sizes="32x32" rel="icon" href="/assets/favicon.ico">
	<style>
		:root {
			--bg: #0c1218;
			--bg-soft: #111a22;
			--panel: #0f171f;
			--panel-2: #131f29;
			--border: #203041;
			--text: #d7e1ea;
			--muted: #8ea3b6;
			--accent: #42d392;
			--accent-2: #12b981;
			--danger: #f87171;
			--warn: #fbbf24;
			--closed: #94a3b8;
			--filtered: #f59e0b;
			--open: #34d399;
			--shadow: 0 16px 35px rgba(0, 0, 0, 0.35);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			height: 100vh;
			background:
				radial-gradient(1200px 400px at 20% -10%, rgba(66, 211, 146, 0.15), transparent 70%),
				radial-gradient(800px 350px at 100% 0%, rgba(59, 130, 246, 0.12), transparent 70%),
				var(--bg);
			color: var(--text);
			font-family: "Segoe UI", "Trebuchet MS", sans-serif;
			overflow: hidden;
		}

		.app {
			display: flex;
			height: 100vh;
			width: 100vw;
		}

		.sidebar {
			width: 290px;
			border-right: 1px solid var(--border);
			background: linear-gradient(180deg, rgba(16, 27, 37, 0.95), rgba(13, 22, 30, 0.95));
			padding: 18px 14px 10px;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 8px;
			font-weight: 700;
			letter-spacing: 0.4px;
			font-size: 15px;
			color: #f1f8ff;
			margin-bottom: 4px;
		}

		.brand-mark {
			width: 18px;
			height: 18px;
			display: block;
			object-fit: contain;
			filter: drop-shadow(0 0 12px rgba(66, 211, 146, 0.8));
		}

		.search {
			background: var(--panel);
			border: 1px solid var(--border);
			color: var(--text);
			border-radius: 10px;
			padding: 9px 10px;
			outline: none;
			width: 100%;
		}

		.new-session {
			border: 1px solid var(--border);
			background: linear-gradient(180deg, #162737, #132131);
			color: #dff7ec;
			border-radius: 10px;
			padding: 10px;
			text-align: center;
			cursor: pointer;
			transition: transform 0.2s ease, border-color 0.2s ease;
		}

		.new-session:hover {
			transform: translateY(-1px);
			border-color: #2c4860;
		}

		.section-title {
			color: var(--muted);
			font-size: 11px;
			letter-spacing: 1px;
			text-transform: uppercase;
			margin-top: 8px;
		}

		.session-list {
			display: flex;
			flex-direction: column;
			gap: 8px;
			overflow: auto;
			padding-right: 2px;
			flex: 1;
		}

		.sidebar-footer {
			margin-top: auto;
			padding-top: 12px;
			border-top: 1px solid rgba(146, 163, 184, 0.18);
			color: var(--muted);
			font-size: 8.5px;
			line-height: 1.5;
			text-align: center;
		}

		.sidebar-footer a {
			color: var(--muted);
			text-decoration: none;
		}

		.sidebar-footer a:hover {
			text-decoration: underline;
		}

		.session-item {
			background: var(--panel);
			border: 1px solid transparent;
			border-radius: 10px;
			padding: 10px;
			cursor: pointer;
			transition: border-color 0.15s ease, background 0.2s ease;
		}

		.session-item.active {
			border-color: #2c4f66;
			background: #162634;
		}

		.session-item-title {
			font-size: 13px;
			color: #e3eef8;
			margin-bottom: 4px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.session-item-subtitle {
			font-size: 11px;
			color: var(--muted);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.main {
			flex: 1;
			display: flex;
			flex-direction: column;
			min-width: 0;
		}

		.tabs {
			display: flex;
			align-items: center;
			gap: 6px;
			border-bottom: 1px solid var(--border);
			background: rgba(10, 16, 22, 0.85);
			padding: 10px;
			overflow-x: auto;
		}

		.tab {
			border: 1px solid transparent;
			border-radius: 10px;
			padding: 7px 10px;
			font-size: 13px;
			color: var(--muted);
			background: #111a23;
			white-space: nowrap;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.tab.active {
			color: #dff9ec;
			border-color: #31556b;
			background: #183143;
		}

		.chat {
			flex: 1;
			overflow: auto;
			padding: 18px;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.msg {
			max-width: min(92%, 980px);
			border-radius: 12px;
			border: 1px solid var(--border);
			box-shadow: var(--shadow);
			animation: reveal 0.22s ease;
		}

		.msg.user {
			align-self: flex-end;
			background: linear-gradient(180deg, #163349, #112b3f);
			border-color: #345c73;
		}

		.msg.assistant {
			align-self: flex-start;
			background: linear-gradient(180deg, #141f28, #0f1a23);
		}

		.msg-head {
			border-bottom: 1px solid rgba(45, 65, 82, 0.5);
			font-size: 11px;
			letter-spacing: 0.5px;
			color: var(--muted);
			padding: 8px 11px;
			text-transform: uppercase;
		}

		.msg-body {
			padding: 10px 12px;
			font-size: 13px;
			line-height: 1.45;
			white-space: pre-wrap;
		}

		.msg-body pre {
			margin: 0;
			font-family: "Consolas", "Courier New", monospace;
			font-size: 12px;
			line-height: 1.45;
			color: #cde6f5;
			white-space: pre-wrap;
			word-break: break-word;
		}

		.status-open { color: var(--open); }
		.status-closed { color: var(--closed); }
		.status-filtered { color: var(--filtered); }
		.status-warn { color: var(--warn); }

		.session-list,
		.tabs,
		.chat {
			scrollbar-width: thin;
			scrollbar-color: rgba(97, 117, 136, 0.55) rgba(10, 16, 22, 0.35);
		}

		.session-list::-webkit-scrollbar,
		.tabs::-webkit-scrollbar,
		.chat::-webkit-scrollbar {
			width: 8px;
			height: 8px;
		}

		.session-list::-webkit-scrollbar-track,
		.tabs::-webkit-scrollbar-track,
		.chat::-webkit-scrollbar-track {
			background: rgba(10, 16, 22, 0.2);
			border-radius: 999px;
		}

		.session-list::-webkit-scrollbar-thumb,
		.tabs::-webkit-scrollbar-thumb,
		.chat::-webkit-scrollbar-thumb {
			background: rgba(97, 117, 136, 0.55);
			border-radius: 999px;
			border: 2px solid rgba(10, 16, 22, 0.35);
		}

		.session-list::-webkit-scrollbar-thumb:hover,
		.tabs::-webkit-scrollbar-thumb:hover,
		.chat::-webkit-scrollbar-thumb:hover {
			background: rgba(97, 117, 136, 0.55);
		}

		.session-list::-webkit-scrollbar-button,
		.tabs::-webkit-scrollbar-button,
		.chat::-webkit-scrollbar-button {
			display: none;
			width: 0;
			height: 0;
		}

		.tabs {
			overflow-x: auto;
			overflow-y: hidden;
		}

		.chat {
			overflow-x: hidden;
		}

		.environment-banner {
			margin: 12px 18px 0;
			border: 1px solid #3b4d60;
			background: linear-gradient(180deg, rgba(35, 47, 59, 0.95), rgba(18, 28, 38, 0.95));
			border-radius: 12px;
			padding: 10px 12px;
			color: #d8e7f2;
			font-size: 13px;
			line-height: 1.4;
		}

		.environment-banner strong {
			color: #ffffff;
		}

		.composer {
			border-top: 1px solid var(--border);
			padding: 12px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			background: rgba(9, 14, 19, 0.85);
		}

		.composer-shell {
			width: 100%;
			border: 1px solid #273c4f;
			border-radius: 16px;
			background: #111c26;
			padding: 10px;
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
		}

		.composer-input {
			display: block;
			width: 100%;
			border: 0;
			outline: none;
			background: transparent;
			color: var(--text);
			font-size: 14px;
			line-height: 1.4;
			padding: 4px 2px 10px;
			min-height: 26px;
		}

		.composer-actions {
			display: flex;
			align-items: center;
			gap: 8px;
			padding-top: 8px;
		}

		.command-help,
		#sendBtn {
			flex: 0 0 auto;
		}

		.command-help {
			border: 1px solid #394c5e;
			border-radius: 999px;
			background: #101c26;
			color: var(--muted);
			font-weight: 700;
			cursor: pointer;
			padding: 0 14px;
			height: 34px;
			transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
		}

		.command-help:hover {
			background: #152432;
			border-color: #4e657b;
			color: #dfeaf3;
			transform: translateY(-1px);
		}

		#sendBtn {
			border: 1px solid #2a5c44;
			border-radius: 999px;
			background: linear-gradient(180deg, var(--accent), var(--accent-2));
			color: #052513;
			font-weight: 700;
			cursor: pointer;
			padding: 0 16px;
			height: 34px;
			transition: filter 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
			margin-left: auto;
		}

		#sendBtn:hover {
			filter: brightness(1.07);
		}

		#sendBtn:disabled {
			cursor: not-allowed;
			opacity: 0.45;
			filter: grayscale(0.35) brightness(0.82);
			transform: none;
		}

		#sendBtn:disabled:hover {
			filter: grayscale(0.35) brightness(0.82);
		}

		.hint {
			color: var(--muted);
			font-size: 12px;
			padding: 0 14px 12px;
		}

		@keyframes reveal {
			from {
				opacity: 0;
				transform: translateY(4px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 980px) {
			.sidebar {
				width: 220px;
			}
			.msg {
				max-width: 98%;
			}
		}

		@media (max-width: 760px) {
			.app {
				flex-direction: column;
			}
			.sidebar {
				width: 100%;
				border-right: none;
				border-bottom: 1px solid var(--border);
				max-height: 240px;
			}
			.section-title,
			.session-list {
				display: none;
			}
		}
	</style>
</head>
<body>
	<div class="app">
		<aside class="sidebar">
			<div class="brand">
				<img class="brand-mark" src="/assets/eye-icon.png" alt="littleBrother" />
				littleBrother
			</div>
			<input id="searchSessions" class="search" type="text" placeholder="Buscar sessões..." />
			<button id="newSessionBtn" class="new-session">+ Nova sessão</button>

			<div class="section-title">Sessões recentes</div>
			<div id="sessionList" class="session-list"></div>

			<footer class="sidebar-footer">
				<div>&copy; Feito por <a href="https://github.com/juletopi" target="_blank" rel="noopener noreferrer">Juletopi</a> | <a href="https://github.com/juletopi/littleBrother" target="_blank" rel="noopener noreferrer">GitHub</a> </div>
			</footer>
		</aside>

		<main class="main">
			<div id="tabs" class="tabs"></div>
			<div id="environmentBanner" class="environment-banner" hidden></div>
			<section id="chat" class="chat"></section>

			<div class="composer">
				<div class="composer-shell">
					<input
						id="commandInput"
						class="composer-input"
						type="text"
						placeholder="scan <targets> <ports> <protocols> [syn|connect]"
					/>
					<div class="composer-actions">
						<button id="helpBtn" class="command-help" type="button">help</button>
						<button id="sendBtn" type="button" disabled>enviar</button>
					</div>
				</div>
			</div>
		</main>
	</div>

	<script>
		const sessions = [];
		let activeSessionId = null;
		let environmentInfo = null;

		function nowTime() {
			return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
		}

		function makeSession(title) {
			const id = `s-${Date.now()}-${Math.floor(Math.random() * 10000)}`;
			const session = {
				id,
				title: title || `sessao-${sessions.length + 1}`,
				lastCommand: "",
				updatedAt: Date.now(),
				messages: [
					{
						role: "assistant",
						text:
							"Pronto para varrer portas TCP/UDP.\nUse: scan <targets> <ports> <protocols> [syn|connect]\nDigite 'help' para ajuda.",
						at: nowTime(),
						html: false,
					},
				],
			};
			sessions.unshift(session);
			activeSessionId = id;
			renderAll();
			return session;
		}

		function getActiveSession() {
			return sessions.find((item) => item.id === activeSessionId);
		}

		function addMessage(role, text, html = false) {
			const session = getActiveSession();
			if (!session) return;
			session.messages.push({ role, text, at: nowTime(), html });
			session.updatedAt = Date.now();
			if (role === "user") {
				session.lastCommand = text;
			}
			renderChat();
			renderSessionList();
		}

		function updateLastAssistantMessage(text, html = false) {
			const session = getActiveSession();
			if (!session) return;
			for (let i = session.messages.length - 1; i >= 0; i -= 1) {
				if (session.messages[i].role === "assistant") {
					session.messages[i].text = text;
					session.messages[i].html = html;
					session.messages[i].at = nowTime();
					break;
				}
			}
			renderChat();
			renderSessionList();
		}

		function renderSessionList() {
			const list = document.getElementById("sessionList");
			const search = document.getElementById("searchSessions").value.trim().toLowerCase();

			const ordered = [...sessions].sort((a, b) => b.updatedAt - a.updatedAt);
			list.innerHTML = "";
			for (const session of ordered) {
				if (search && !session.title.toLowerCase().includes(search) && !session.lastCommand.toLowerCase().includes(search)) {
					continue;
				}

				const item = document.createElement("div");
				item.className = `session-item ${session.id === activeSessionId ? "active" : ""}`;
				item.innerHTML = `
					<div class="session-item-title">${escapeHtml(session.title)}</div>
					<div class="session-item-subtitle">${escapeHtml(session.lastCommand || "sem comandos")}</div>
				`;
				item.addEventListener("click", () => {
					activeSessionId = session.id;
					renderAll();
				});
				list.appendChild(item);
			}
		}

		function renderTabs() {
			const tabs = document.getElementById("tabs");
			tabs.innerHTML = "";

			const ordered = [...sessions].sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 8);
			for (const session of ordered) {
				const tab = document.createElement("button");
				tab.className = `tab ${session.id === activeSessionId ? "active" : ""}`;
				tab.textContent = session.title;
				tab.addEventListener("click", () => {
					activeSessionId = session.id;
					renderAll();
				});
				tabs.appendChild(tab);
			}
		}

		function renderChat() {
			const chat = document.getElementById("chat");
			const session = getActiveSession();
			chat.innerHTML = "";
			if (!session) return;

			for (const msg of session.messages) {
				const card = document.createElement("div");
				card.className = `msg ${msg.role}`;

				const roleName = msg.role === "user" ? "comando" : "scanner";
				card.innerHTML = `
					<div class="msg-head">${roleName} • ${msg.at}</div>
					<div class="msg-body"></div>
				`;

				const body = card.querySelector(".msg-body");
				if (msg.html) {
					body.innerHTML = msg.text;
				} else {
					const pre = document.createElement("pre");
					pre.textContent = msg.text;
					body.appendChild(pre);
				}

				chat.appendChild(card);
			}

			chat.scrollTop = chat.scrollHeight;
		}

		function renderAll() {
			renderSessionList();
			renderTabs();
			renderEnvironmentBanner();
			renderChat();
		}

		function renderEnvironmentBanner() {
			const banner = document.getElementById("environmentBanner");
			if (!environmentInfo) {
				banner.hidden = true;
				banner.textContent = "";
				return;
			}

			const notes = Array.isArray(environmentInfo.notes) ? environmentInfo.notes : [];
			const parts = [];
			parts.push(`<strong>Ambiente detectado:</strong> ${escapeHtml(environmentInfo.platform_name || environmentInfo.platform || "desconhecido")}`);
			if (environmentInfo.is_windows) {
				parts.push("<strong>Aviso:</strong> no Windows, firewall e politicas de rede podem aumentar a quantidade de portas marcadas como filtered.");
			}
			if (!environmentInfo.syn_scan_available) {
				parts.push("<strong>SYN:</strong> indisponivel neste ambiente. O backend usa TCP connect como fallback.");
			}
			if (notes.length) {
				parts.push(notes.map((note) => escapeHtml(note)).join(" "));
			}

			banner.innerHTML = parts.join("<br />");
			banner.hidden = false;
		}

		function escapeHtml(value) {
			return value
				.replaceAll("&", "&amp;")
				.replaceAll("<", "&lt;")
				.replaceAll(">", "&gt;")
				.replaceAll('"', "&quot;")
				.replaceAll("'", "&#39;");
		}

		function updateSendButtonState() {
			const input = document.getElementById("commandInput");
			const sendBtn = document.getElementById("sendBtn");
			sendBtn.disabled = input.value.trim().length === 0;
		}

		function parseCommand(input) {
			const trimmed = input.trim();
			if (!trimmed) {
				return { kind: "empty" };
			}

			if (trimmed.toLowerCase() === "help") {
				return { kind: "help" };
			}

			const parts = trimmed.split(/\s+/);
			if (parts[0].toLowerCase() !== "scan") {
				return { kind: "invalid", error: "Comando invalido. Use 'scan' ou 'help'." };
			}

			if (parts.length < 3) {
				return {
					kind: "invalid",
					error: "Formato: scan <targets> <ports> <protocols> [syn|connect] ou scan <targets> <protocols> [syn|connect]",
				};
			}

			const isProtocolToken = (token) => ["tcp", "udp", "tcp,udp", "udp,tcp"].includes((token || "").toLowerCase());

			let ports = "1-1024";
			let protocols = "tcp";
			let method = "connect";

			if (parts.length === 3) {
				if (!isProtocolToken(parts[2])) {
					return {
						kind: "invalid",
						error: "Quando usar formato curto, informe protocolo: tcp, udp ou tcp,udp.",
					};
				}
				protocols = parts[2];
			} else if (parts.length === 4 && isProtocolToken(parts[2])) {
				protocols = parts[2];
				method = parts[3].toLowerCase();
			} else {
				ports = parts[2];
				protocols = parts[3];
				method = (parts[4] || "connect").toLowerCase();
			}

			if (!["syn", "connect"].includes(method)) {
				return { kind: "invalid", error: "Metodo TCP deve ser syn ou connect." };
			}

			return {
				kind: "scan",
				payload: {
					targets: parts[1],
					ports,
					protocols,
					tcp_method: method,
					timeout: 1.0,
					workers: 200,
				},
			};
		}

		function formatResponse(data) {
			if (!data || !data.ok) {
				return `<span class="status-warn">Falha na varredura.</span>`;
			}

			const lines = [];
			lines.push(`scan concluido em ${data.scan.duration_seconds}s`);
			lines.push(`metodo tcp: ${data.scan.tcp_method}`);
			lines.push("");

			for (const target of data.scan.targets) {
				lines.push(`alvo ${target}`);
				for (const protocol of data.scan.protocols) {
					const items = data.results[target][protocol] || [];
					if (!items.length) {
						continue;
					}
					const open = items.filter((i) => i.status === "open").map((i) => i.port);
					const closed = items.filter((i) => i.status === "closed").map((i) => i.port);
					const filtered = items.filter((i) => i.status === "filtered").map((i) => i.port);

					lines.push(`  ${protocol.toUpperCase()}:`);
					lines.push(`    open: ${open.length ? open.join(",") : "-"}`);
					lines.push(`    closed: ${closed.length ? closed.join(",") : "-"}`);
					lines.push(`    filtered: ${filtered.length ? filtered.join(",") : "-"}`);
				}
				lines.push("");
			}

			if (Array.isArray(data.warnings) && data.warnings.length) {
				lines.push("avisos:");
				for (const warning of data.warnings) {
					lines.push(`  - ${warning}`);
				}
			}

			const escaped = escapeHtml(lines.join("\n"));
			const highlighted = escaped
				.replaceAll("open:", '<span class="status-open">open:</span>')
				.replaceAll("closed:", '<span class="status-closed">closed:</span>')
				.replaceAll("filtered:", '<span class="status-filtered">filtered:</span>');

			return `<pre>${highlighted}</pre>`;
		}

		async function sendCommand() {
			const input = document.getElementById("commandInput");
			const raw = input.value;
			const command = parseCommand(raw);
			if (command.kind === "empty") {
				return;
			}

			addMessage("user", raw, false);
			input.value = "";
			updateSendButtonState();

			if (command.kind === "help") {
				addMessage(
					"assistant",
					[
						"Comandos disponiveis:",
						"help",
						"scan <targets> <ports> <protocols> [syn|connect]",
						"scan <targets> <protocols> [syn|connect]",
						"",
						"Exemplos:",
						"scan 127.0.0.1 1-1024 tcp connect",
						"scan 192.168.0.10 tcp connect",
						"scan 192.168.0.10,192.168.0.12 22,53,80,443 tcp,udp syn",
					].join("\n"),
					false
				);
				return;
			}

			if (command.kind === "invalid") {
				addMessage("assistant", command.error, false);
				return;
			}

			addMessage("assistant", "Executando varredura...", false);

			try {
				const response = await fetch("/api/scan", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify(command.payload),
				});

				const data = await response.json();
				if (!response.ok || !data.ok) {
					updateLastAssistantMessage(
						`<span class="status-warn">Erro: ${escapeHtml(data.error || "falha desconhecida")}</span>`,
						true
					);
					return;
				}

				updateLastAssistantMessage(formatResponse(data), true);

				const active = getActiveSession();
				if (active && active.title.startsWith("sessao-")) {
					active.title = command.payload.targets.split(",")[0];
					renderAll();
				}
			} catch (error) {
				updateLastAssistantMessage(
					`<span class="status-warn">Erro de comunicacao com o backend: ${escapeHtml(String(error))}</span>`,
					true
				);
			}
		}

		document.getElementById("sendBtn").addEventListener("click", sendCommand);
		document.getElementById("helpBtn").addEventListener("click", () => {
			const input = document.getElementById("commandInput");
			input.value = "help";
			sendCommand();
		});
		document.getElementById("commandInput").addEventListener("input", updateSendButtonState);
		document.getElementById("commandInput").addEventListener("keydown", (event) => {
			if (event.key === "Enter") {
				sendCommand();
			}
		});
		document.getElementById("newSessionBtn").addEventListener("click", () => makeSession());
		document.getElementById("searchSessions").addEventListener("input", renderSessionList);

		makeSession("sessao-1");
		updateSendButtonState();
	</script>
</body>
</html>
